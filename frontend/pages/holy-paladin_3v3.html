<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>Cluster·Pick — Talent build clusters</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* === Theme tokens === */
:root {
  --bg-0: #0a0d12;
  --bg-1: #0f1319;
  --bg-2: #141925;
  --bg-3: #1b2231;
  --line: #232a3a;
  --line-2: #2d3650;
  --text-0: #e6ebf2;
  --text-1: #b0bacb;
  --text-2: #6e7a91;
  --text-3: #4a5468;

  /* Status colors */
  --core: #6ee3a3;        /* taken / locked-in */
  --core-dim: #2a5a40;
  --flex: #f5b342;        /* flexible */
  --flex-dim: #6b4a18;
  --skip: #2a3142;        /* not taken */
  --capstone: #b794f4;

  --accent: #4d9fff;

  /* Heatmap stops (cool -> hot) */
  --heat-0: #1a2235;
  --heat-1: #1f3a5a;
  --heat-2: #2d5e7d;
  --heat-3: #5a8a6f;
  --heat-4: #c6a04a;
  --heat-5: #d97757;

  --font-sans: 'Geist', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-0);
  color: var(--text-0);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv11', 'ss01';
}

button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

/* === Layout shell === */
.app {
  display: grid;
  grid-template-rows: 56px 72px 1fr;
  height: 100vh;
  width: 100vw;
}

/* Top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: 13px; letter-spacing: 0.02em;
}
.brand-mark {
  width: 22px; height: 22px;
  background: linear-gradient(135deg, var(--accent), var(--flex));
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
.crumb {
  display: flex; align-items: center; gap: 8px;
  color: var(--text-2); font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.crumb .sep { color: var(--text-3); }
.crumb .active { color: var(--text-0); }

.topbar-right { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.topbar-stat {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
}
.topbar-stat-val { font-size: 12px; color: var(--text-0); font-weight: 500; }

.filter-group {
  display: flex; align-items: center; gap: 8px;
}
.filter-label {
  color: var(--text-2); font-size: 10px;
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em;
}
.seg {
  display: flex; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 4px; overflow: hidden;
}
.seg button {
  background: transparent; border: 0; color: var(--text-1);
  padding: 5px 10px; font-size: 11px; font-family: var(--font-mono);
  letter-spacing: 0.05em; text-transform: uppercase;
}
.seg button.active {
  background: var(--bg-3); color: var(--text-0);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover:not(.active) { background: var(--bg-3); }

.btn {
  background: var(--bg-2); border: 1px solid var(--line);
  color: var(--text-0); padding: 6px 12px; border-radius: 4px;
  font-size: 11px; font-family: var(--font-mono);
  letter-spacing: 0.06em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { background: var(--bg-3); border-color: var(--line-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg-0); }
.btn.primary:hover { filter: brightness(1.08); }

/* Cluster tabs */
.tabs {
  display: flex;
  padding: 0 16px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  background: transparent; border: 0;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 3px;
  align-items: flex-start; min-width: 160px;
  padding: 14px 18px 16px;
  gap: 4px;
  color: var(--text-1);
  position: relative;
  transition: background 0.12s;
}
.tab:first-child { border-left: 1px solid var(--line); }
.tab:hover { background: var(--bg-2); }
.tab.active { background: var(--bg-0); color: var(--text-0); }
.tab.active::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--accent);
}
.tab-name { font-size: 12px; font-weight: 600; text-align: left; }
.tab-rank {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.12em; color: var(--text-3);
  margin-bottom: 1px;
}
.tab.active .tab-rank { color: var(--accent); }
.tab-meta {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.06em; color: var(--text-2);
  display: flex; gap: 10px;
}
.tab-meta .pct { color: var(--flex); font-weight: 600; }
.tab.active .tab-meta .pct { color: var(--core); }
.tab-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; background: var(--bg-3);
}
.tab-bar-fill { height: 100%; background: var(--text-3); }
.tab-minor {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  font-size: 10px;
  color: var(--text-3);
  cursor: default;
  font-family: var(--font-mono);
  letter-spacing: 0.05em;
  border-left: 1px solid var(--border);
}

.tab.active .tab-bar-fill { background: var(--accent); }

/* Main grid */
.main {
  display: grid;
  grid-template-columns: 1fr 320px;
  overflow: hidden;
}
.tree-pane {
  position: relative;
  overflow: auto;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(77,159,255,0.06), transparent 60%),
    var(--bg-0);
}
.tree-pane-inner {
  display: flex;
  flex-direction: column;
  padding: 32px 40px 60px;
  min-width: 1140px;
}
.trees-row {
  display: flex;
  gap: 56px;
}
.tree { flex: 0 0 auto; }

.tree {
  position: relative;
  flex: 1;
}
.tree-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--line);
}
.tree-header h3 {
  margin: 0;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-1); font-weight: 600;
}
.tree-header .stat {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-2);
  letter-spacing: 0.08em;
}
.tree-header .stat .num { color: var(--text-0); }

.tree-svg-wrap { position: relative; }

/* Node states */
.node-group { cursor: default; }
.node-shape {
  fill: var(--skip);
  stroke: var(--line-2);
  stroke-width: 1.5;
  transition: fill 0.12s, stroke 0.12s, filter 0.12s;
}
.node-group.core .node-shape {
  fill: var(--bg-3);
  stroke: var(--core);
  stroke-width: 2;
}
.node-group.flex .node-shape {
  fill: var(--bg-3);
  stroke: var(--flex);
  stroke-width: 2;
}
.node-group.skip .node-shape {
  opacity: 0.6;
}

/* Flex highlight styles (controlled by tweaks) */
.tree-svg.flex-glow .node-group.flex .node-shape {
  filter: drop-shadow(0 0 6px rgba(245, 179, 66, 0.55));
}
.tree-svg.flex-dashed .node-group.flex .node-shape {
  stroke-dasharray: 4 3;
}
.tree-svg.flex-fill .node-group.flex .node-shape {
  fill: rgba(245, 179, 66, 0.18);
}
.tree-svg.flex-pulse .node-group.flex .node-shape {
  animation: flexPulse 1.8s ease-in-out infinite;
}
@keyframes flexPulse {
  0%, 100% { stroke-opacity: 1; filter: drop-shadow(0 0 0 rgba(245,179,66,0)); }
  50% { stroke-opacity: 0.7; filter: drop-shadow(0 0 8px rgba(245,179,66,0.7)); }
}

/* Heatmap mode — recolor node shape based on pick rate */
.tree-svg.heatmap .node-group .node-shape {
  stroke: var(--line-2);
  stroke-width: 1.5;
}
.tree-svg.heatmap .node-group .node-shape[data-heat="0"] { fill: var(--heat-0); }
.tree-svg.heatmap .node-group .node-shape[data-heat="1"] { fill: var(--heat-1); }
.tree-svg.heatmap .node-group .node-shape[data-heat="2"] { fill: var(--heat-2); }
.tree-svg.heatmap .node-group .node-shape[data-heat="3"] { fill: var(--heat-3); }
.tree-svg.heatmap .node-group .node-shape[data-heat="4"] { fill: var(--heat-4); }
.tree-svg.heatmap .node-group .node-shape[data-heat="5"] { fill: var(--heat-5); }
.tree-svg.heatmap .node-group.skip .node-shape { fill: var(--heat-0); opacity: 0.7; }

/* Rank-flex: static-take but rank varies. Inner dashed amber ring. */
.node-inner-ring {
  fill: none !important;
  stroke: var(--flex);
  stroke-width: 1.5;
  stroke-dasharray: 2.5 2;
  opacity: 0.85;
  pointer-events: none;
}
.tree-svg.heatmap .node-inner-ring { stroke: var(--flex); }

/* Cluster-take accent (contested talent picked by this cluster). */
.node-signature-ring {
  fill: var(--accent) !important;
  stroke: none;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
.tree-svg.show-signature .node-group.contested-take .node-signature-ring { opacity: 0.85; }
.tree-svg.show-signature .node-group.contested-take .node-shape { stroke: var(--accent); }

.node-label {
  font-family: var(--font-sans);
  font-size: 10px;
  fill: var(--text-1);
  text-anchor: middle;
  pointer-events: none;
  letter-spacing: 0.02em;
}
.node-group.skip .node-label { fill: var(--text-3); }
.node-group.core .node-label { fill: var(--text-0); }
.node-group.flex .node-label { fill: var(--flex); }

.node-points {
  font-family: var(--font-mono);
  font-size: 9.5px;
  fill: var(--text-0);
  text-anchor: middle;
  font-weight: 600;
  pointer-events: none;
}
.node-group.skip .node-points { display: none; }

.edge {
  stroke: var(--line);
  stroke-width: 2;
}
.edge.active {
  stroke: var(--core);
  stroke-width: 2.5;
  opacity: 0.55;
}
.edge.flex {
  stroke: var(--flex);
  stroke-width: 2;
  stroke-dasharray: 3 3;
  opacity: 0.6;
}

/* Tooltip */
.tooltip {
  position: fixed;
  z-index: 50;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 4px;
  padding: 10px 12px;
  min-width: 220px;
  max-width: 280px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  pointer-events: none;
  font-size: 12px;
  transform: translate(12px, 12px);
}
.tooltip-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
  gap: 8px;
}
.tooltip-name { font-weight: 600; font-size: 12.5px; color: var(--text-0); }
.tooltip-tag {
  font-family: var(--font-mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.1em;
  padding: 2px 5px; border-radius: 2px;
}
.tooltip-tag.core { background: rgba(110, 227, 163, 0.15); color: var(--core); }
.tooltip-tag.flex { background: rgba(245, 179, 66, 0.15); color: var(--flex); }
.tooltip-tag.skip { background: rgba(110, 122, 145, 0.15); color: var(--text-2); }
.tooltip-tag.contested { background: rgba(77, 159, 255, 0.18); color: var(--accent); }

.tooltip-desc {
  color: var(--text-1); font-size: 11.5px; margin-bottom: 8px; line-height: 1.5;
}
.tooltip-stat {
  display: flex; justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 6px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-2); letter-spacing: 0.04em;
}
.tooltip-stat .v { color: var(--text-0); font-weight: 600; }
.tooltip-bar {
  height: 3px; background: var(--bg-3); border-radius: 1.5px;
  margin-top: 6px; overflow: hidden;
}
.tooltip-bar-fill { height: 100%; background: var(--accent); }

/* Sidebar */
.sidebar {
  background: var(--bg-1);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.side-section { padding: 16px 18px; border-bottom: 1px solid var(--line); }
.side-section h4 {
  margin: 0 0 10px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text-2); font-weight: 600;
}
.cluster-title {
  font-size: 18px; font-weight: 600; margin: 0 0 6px;
}
.cluster-tagline {
  color: var(--text-1); font-size: 12px; line-height: 1.55;
}
.kpi-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--line); margin-top: 14px;
  border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
}
.kpi {
  background: var(--bg-2); padding: 10px 12px;
}
.kpi-label {
  font-family: var(--font-mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-2); margin-bottom: 4px;
}
.kpi-value {
  font-family: var(--font-mono); font-size: 18px;
  color: var(--text-0); font-weight: 500;
}
.kpi-value .pct { color: var(--core); font-size: 13px; margin-left: 2px; }

.flex-slot {
  border: 1px solid var(--line);
  border-radius: 4px;
  margin-bottom: 8px;
  overflow: hidden;
}
.flex-slot-head {
  background: var(--bg-2);
  padding: 8px 12px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--line);
}
.flex-slot-label {
  font-size: 11px; color: var(--text-1); font-weight: 500;
}
.flex-slot-tag {
  font-family: var(--font-mono); font-size: 9px;
  color: var(--flex); letter-spacing: 0.08em; text-transform: uppercase;
}
.flex-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  border-top: 1px solid var(--line);
}
.flex-opt:first-of-type { border-top: 0; }
.flex-opt-dot {
  width: 7px; height: 7px; background: var(--flex);
  transform: rotate(45deg);
  flex-shrink: 0;
}
.flex-opt-name { flex: 1; font-size: 12px; }
.flex-opt-pct {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-1);
  min-width: 36px; text-align: right;
}
.flex-opt-bar {
  width: 60px; height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden;
}
.flex-opt-bar-fill { height: 100%; background: var(--flex); }

.legend {
  display: flex; flex-direction: column; gap: 8px;
}
.legend-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; color: var(--text-1);
}
.legend-dot {
  width: 14px; height: 14px; flex-shrink: 0;
  border: 2px solid transparent;
  background: var(--bg-3);
}
.legend-dot.core { border-color: var(--core); }
.legend-dot.core.rank-flex-mini {
  position: relative;
}
.legend-dot.core.rank-flex-mini::after {
  content: ''; position: absolute; inset: 2px;
  border: 1px dashed var(--flex);
  border-radius: 50%;
}
.legend-dot.core.contested-mini {
  border-color: var(--core);
  position: relative;
}
.legend-dot.core.contested-mini::after {
  content: ''; position: absolute; inset: 3px;
  background: var(--accent);
  border-radius: 50%;
}
.legend-dot.flex { border-color: var(--flex); }
.legend-dot.skip { background: var(--skip); border-color: var(--line-2); }
.legend-dot.diamond { transform: rotate(45deg); }

.build-string {
  margin-top: 10px;
  background: var(--bg-0);
  border: 1px solid var(--line);
  padding: 8px 10px;
  border-radius: 3px;
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-2);
  word-break: break-all;
  line-height: 1.5;
}
.build-actions {
  margin-top: 8px;
  display: flex; gap: 8px;
}
.copy-toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--core);
  padding: 9px 16px; border-radius: 3px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em; text-transform: uppercase;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  z-index: 100;
  animation: toastIn 0.2s ease-out;
}
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* Heatmap scale legend strip */
.heat-strip {
  display: flex; gap: 0; margin-top: 8px;
  border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
}
.heat-strip > div { flex: 1; height: 10px; }
.heat-strip-labels {
  display: flex; justify-content: space-between;
  margin-top: 4px;
  font-family: var(--font-mono); font-size: 9px; color: var(--text-2);
}

/* === PvP panel === */
.pvp-panel {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px dashed var(--line);
  width: 100%;
}
.pvp-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px;
}
.pvp-head h3 {
  margin: 0;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-1); font-weight: 600;
}
.pvp-head .stat {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-2);
  letter-spacing: 0.08em;
}
.pvp-head .stat .num { color: var(--text-0); }

.pvp-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) 1.4fr;
  gap: 12px;
  align-items: stretch;
}

.pvp-slot {
  border: 1px solid var(--line);
  background: var(--bg-1);
  border-radius: 4px;
  padding: 12px 14px;
  display: flex; flex-direction: column;
  position: relative;
  min-height: 96px;
  transition: border-color 0.12s, background 0.12s;
}
.pvp-slot:hover { border-color: var(--line-2); background: var(--bg-2); }
.pvp-slot-tag {
  position: absolute; top: 8px; right: 10px;
  font-family: var(--font-mono); font-size: 9px;
  color: var(--text-3); letter-spacing: 0.1em;
}
.pvp-slot-pos {
  font-family: var(--font-mono); font-size: 9px;
  color: var(--text-2); letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 6px;
}
.pvp-slot-name {
  font-size: 14px; font-weight: 600; color: var(--text-0);
  margin-bottom: 4px;
}
.pvp-slot-pct {
  font-family: var(--font-mono); font-size: 18px; color: var(--core);
  font-weight: 500; margin-top: auto;
}
.pvp-slot-pct .unit { color: var(--text-2); font-size: 11px; margin-left: 2px; }

.pvp-slot.alt { background: var(--bg-0); border-style: dashed; }
.pvp-slot.alt .pvp-slot-pos { color: var(--flex); }

.pvp-alts {
  border: 1px solid var(--line);
  background: var(--bg-1);
  border-radius: 4px;
  padding: 10px 12px;
  display: flex; flex-direction: column;
  min-height: 96px;
}
.pvp-alts-head {
  font-family: var(--font-mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text-2); margin-bottom: 8px;
}
.pvp-alts-list {
  display: flex; flex-direction: column; gap: 4px; flex: 1;
}
.pvp-alt-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  padding: 2px 0;
}
.pvp-alt-name {
  flex: 1; color: var(--text-1);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pvp-alt-bar {
  width: 60px; height: 3px; background: var(--bg-3);
  border-radius: 1.5px; overflow: hidden;
}
.pvp-alt-bar-fill { height: 100%; background: var(--text-2); }
.pvp-alt-pct {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-2); min-width: 26px; text-align: right;
}

/* Tooltip — rank distribution */
.tooltip-rank-title {
  font-family: var(--font-mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-2); margin-top: 8px; margin-bottom: 4px;
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
  <script type="text/babel">
// Tree renderer — converts (col, row) nodes + edges to SVG with diamond/circle shapes.
// Receives current cluster's node-state map so it can render core/flex/skip + rank-flex.

const COL_W = 70;
const ROW_H = 78;
const PAD_X = 36;
const PAD_Y = 28;

function nodeXY(node) {
  return {
    x: PAD_X + node.col * COL_W,
    y: PAD_Y + node.row * ROW_H,
  };
}

function isRankFlex(node, state) {
  if (!state || !state.rankDist || node.maxPoints < 2) return false;
  const total = state.rankDist.reduce((s, v) => s + v, 0);
  if (total <= 0) return false;
  const max = Math.max(...state.rankDist);
  // Rank-flex: no single rank dominates >= 75% of the picks
  return max / total < 0.75;
}

function modalRank(state) {
  if (!state.rankDist) return state.pts;
  let bestI = 0, bestV = -1;
  state.rankDist.forEach((v, i) => { if (v > bestV) { bestV = v; bestI = i; } });
  return bestI + 1;
}

function shapeFor(node, x, y, size) {
  if (node.type === 'diamond' || node.type === 'capstone') {
    const s = size;
    return `${x},${y - s} ${x + s},${y} ${x},${y + s} ${x - s},${y}`;
  }
  return null;
}

function NodeShape({ node, x, y, scale = 1, extraClass = '', heat }) {
  const r = (node.type === 'capstone' ? 20 : node.type === 'diamond' ? 16 : 15) * scale;
  if (node.type === 'diamond' || node.type === 'capstone') {
    return <polygon
      className={`node-shape ${extraClass}`}
      data-heat={heat}
      points={`${x},${y - r} ${x + r},${y} ${x},${y + r} ${x - r},${y}`}
    />;
  }
  return <circle className={`node-shape ${extraClass}`} data-heat={heat} cx={x} cy={y} r={r} />;
}

function heatBucket(rate) {
  if (rate >= 95) return 5;
  if (rate >= 80) return 4;
  if (rate >= 65) return 3;
  if (rate >= 45) return 2;
  if (rate >= 25) return 1;
  return 0;
}

function TalentTree({ tree, cluster, onHover, onLeave, flexStyle, heatmap, showSignature }) {
  const widthCols = Math.max(...tree.nodes.map(n => n.col)) + 1;
  const heightRows = Math.max(...tree.nodes.map(n => n.row)) + 1;
  const W = PAD_X * 2 + (widthCols - 1) * COL_W;
  const H = PAD_Y * 2 + (heightRows - 1) * ROW_H;

  const stateFor = (id) => cluster.nodes[id];

  const svgClass = [
    'tree-svg',
    flexStyle ? `flex-${flexStyle}` : '',
    heatmap ? 'heatmap' : '',
    showSignature ? 'show-signature' : '',
  ].filter(Boolean).join(' ');

  return (
    <div className="tree-svg-wrap">
      <svg
        className={svgClass}
        width={W} height={H}
        viewBox={`0 0 ${W} ${H}`}
      >
        <g>
          {tree.edges.map(([a, b], i) => {
            const na = tree.nodes.find(n => n.id === a);
            const nb = tree.nodes.find(n => n.id === b);
            if (!na || !nb) return null;
            const pa = nodeXY(na);
            const pb = nodeXY(nb);
            const sa = stateFor(a);
            const sb = stateFor(b);
            let cls = 'edge';
            if (sa && sb) {
              if (sa.role === 'flex' || sb.role === 'flex') cls = 'edge flex';
              else cls = 'edge active';
            }
            return (
              <line key={i} className={cls}
                x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
              />
            );
          })}
        </g>

        <g>
          {tree.nodes.map((node) => {
            const { x, y } = nodeXY(node);
            const st = stateFor(node.id);
            const role = st ? st.role : 'skip';
            const pickRate = st ? st.pickRate : 0;
            const heat = heatBucket(pickRate);
            const rankFlex = st && isRankFlex(node, st);
            const contestedTake = st && st.contested;
            const displayRank = st ? (st.rankDist ? modalRank(st) : st.pts) : 0;

            const onEnter = (e) => onHover({ node, state: st, x: e.clientX, y: e.clientY });
            const onMove = (e) => onHover({ node, state: st, x: e.clientX, y: e.clientY });

            return (
              <g key={node.id}
                className={`node-group ${role} ${rankFlex ? 'rank-flex' : ''} ${contestedTake ? 'contested-take' : ''}`}
                onMouseEnter={onEnter}
                onMouseMove={onMove}
                onMouseLeave={onLeave}
              >
                <NodeShape node={node} x={x} y={y} heat={heat} />
                {/* Inner dashed ring for rank-flex core nodes */}
                {rankFlex && (
                  <NodeShape
                    node={node} x={x} y={y}
                    scale={0.62}
                    extraClass="node-inner-ring"
                  />
                )}
                {/* Cluster-take accent ring for contested takes */}
                {contestedTake && !rankFlex && (
                  <NodeShape
                    node={node} x={x} y={y}
                    scale={0.55}
                    extraClass="node-signature-ring"
                  />
                )}
                {displayRank > 0 && (
                  <text className="node-points" x={x} y={y + 3}>
                    {displayRank}{node.maxPoints > 1 ? `/${node.maxPoints}` : ''}
                  </text>
                )}
                <text className="node-label" x={x} y={y + 32}>
                  {truncateLabel(node.name)}
                </text>
              </g>
            );
          })}
        </g>
      </svg>
    </div>
  );
}

function truncateLabel(s) {
  return s.length > 14 ? s.slice(0, 13) + '…' : s;
}

window.TalentTree = TalentTree;
window.isRankFlex = isRankFlex;
window.modalRank = modalRank;

</script>

  <script type="text/babel">
// Main app — composes topbar, cluster tabs, tree pane, global PvP panel,
// sidebar (Cluster Signature), bottom Gear panel, tooltip, and tweaks panel.
//
// Wired to the flat backend shape (one bracket per CLUSTER_DATA):
//   data.spec, data.bracket, data.specLabel, data.sample_size, data.avg_ilvl,
//   data.pvp_talents, data.talents.{core|flex|contested}, data.clusters,
//   data.gear.{avg_ilvl, slots}

const { useState, useEffect, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "flexStyle": "glow",
  "heatmap": false,
  "showSignature": true
}/*EDITMODE-END*/;

const FLEX_STYLES = [
  { value: 'glow',   label: 'Glow' },
  { value: 'dashed', label: 'Dashed' },
  { value: 'fill',   label: 'Tint' },
  { value: 'pulse',  label: 'Pulse' },
];

// === Auto-name a cluster by its 1–2 most defining contested takes ==========
// "Most defining" = lowest global pick rate among takes (most selective choice).
function autoClusterName(cluster) {
  const takes = (cluster.takes || [])
    .filter(t => t.name && t.pct >= 20 && t.pct <= 80)
    .sort((a, b) => a.pct - b.pct);
  if (!takes.length) return `#${cluster.rank}`;
  const word1 = (name) => name.split(' ')[0];
  if (takes.length === 1) return word1(takes[0].name);
  return word1(takes[0].name) + ' + ' + word1(takes[1].name);
}

// === Derive per-cluster tree-node state =====================================
// Global core → core; global flex → flex; cluster.takes → core+contested.
// Everything else → not in map (renders as skip).
function deriveNodeMap(data, cluster) {
  const map = {};
  (data.talents.core || []).forEach(t => {
    map[t.id] = { role: 'core', pts: 1, pickRate: t.pct, sourceName: t.name };
  });
  (data.talents.flex || []).forEach(t => {
    map[t.id] = { role: 'flex', pts: 1, pickRate: t.pct, sourceName: t.name };
  });
  (cluster.takes || []).forEach(t => {
    map[t.id] = { role: 'core', pts: 1, pickRate: t.pct, sourceName: t.name, contested: true };
  });
  return map;
}


// Pick the hero tree whose nodeIds have the most overlap with the cluster's
// core+takes node IDs. Falls back to the right tree (Totemic for Resto Shaman).
function selectHeroTree(data, nodeMap) {
  const heroTrees = data.tree && data.tree.heroTrees;
  if (!heroTrees) return null;
  const dominated = (ht) => ht.nodeIds.filter(id => nodeMap[id]).length;
  return dominated(heroTrees.left) >= dominated(heroTrees.right)
    ? heroTrees.left : heroTrees.right;
}
function App() {
  const data = window.CLUSTER_DATA;

  // Sort clusters by share descending.
  const clusters = useMemo(
    () => [...data.clusters].sort((a, b) => b.pct - a.pct),
    [data]
  );
  // Only display clusters with 2+ players; single-player outliers are noise.
  const majorClusters = useMemo(() => clusters.filter(c => c.count >= 2), [clusters]);
  const minorCount = clusters.length - majorClusters.length;

  const [activeRank, setActiveRank] = useState(majorClusters[0].rank);
  useEffect(() => {
    if (!majorClusters.find(c => c.rank === activeRank)) setActiveRank(majorClusters[0].rank);
  }, [majorClusters, activeRank]);

  const cluster = clusters.find(c => c.rank === activeRank) || clusters[0];

  // Derived node-state map for the active cluster.
  const nodeMap = useMemo(() => deriveNodeMap(data, cluster), [data, cluster]);
  const clusterForRenderer = { ...cluster, nodes: nodeMap, name: autoClusterName(cluster) };
  const heroTree = useMemo(() => selectHeroTree(data, nodeMap), [data, nodeMap]);

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tip, setTip] = useState(null);
  const [toast, setToast] = useState(null);

  // Keyboard nav — ← / → between clusters.
  useEffect(() => {
    function onKey(e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const idx = majorClusters.findIndex(c => c.rank === activeRank);
      if (e.key === 'ArrowRight') setActiveRank(majorClusters[(idx + 1) % majorClusters.length].rank);
      else if (e.key === 'ArrowLeft') setActiveRank(majorClusters[(idx - 1 + majorClusters.length) % majorClusters.length].rank);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [clusters, activeRank]);

  const onCopy = () => {
    navigator.clipboard.writeText(cluster.canonical_code).catch(() => {});
    setToast('Build code copied');
    setTimeout(() => setToast(null), 1500);
  };

  return (
    <div className="app" data-screen-label="Talent cluster picker">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark"></div>
          CLUSTER<span style={{color:'var(--text-2)'}}>·</span>PICK
        </div>
        <div className="crumb">
          <span>{data.specLabel.class}</span>
          <span className="sep">/</span>
          <span className="active">{data.specLabel.spec}</span>
          <span className="sep">/</span>
          <span style={{color:'var(--text-3)'}}>{data.bracket}</span>
        </div>

        <div className="topbar-right">
          <div className="topbar-stat">
            <span className="filter-label">N</span>
            <span className="topbar-stat-val">{data.sample_size.toLocaleString()}</span>
          </div>
        </div>
      </header>

      <nav className="tabs" role="tablist" aria-label="Cluster">
        {majorClusters.map(c => (
          <button
            key={c.rank}
            className={`tab ${c.rank === activeRank ? 'active' : ''}`}
            onClick={() => setActiveRank(c.rank)}
            role="tab"
            data-screen-label={autoClusterName(c)}
          >
            <span className="tab-rank">#{c.rank}</span>
            <span className="tab-name">{autoClusterName(c)}</span>
            <span className="tab-meta">
              <span><span className="pct">{c.pct}%</span></span>
              <span>n={c.count}</span>
            </span>
            <span className="tab-bar">
              <span className="tab-bar-fill" style={{width: `${Math.min(100, c.pct * 4)}%`}}></span>
            </span>
          </button>
        ))}
        {minorCount > 0 && (
          <div className="tab tab-minor" title={`${minorCount} more clusters with n=1 (outliers)`}>
            +{minorCount} minor
          </div>
        )}
      </nav>

      <main className="main">
        <section className="tree-pane">
          <div className="tree-pane-inner">
            <div className="trees-row">
              {(() => { const src = window.CLUSTER_DATA.tree || window.TREE; const trees = heroTree ? [src.trees[0], heroTree, src.trees[1]] : src.trees; return trees; })().map(tree => (
                <div className="tree" key={tree.id}>
                  <div className="tree-header">
                    <h3>{tree.label}</h3>
                    <div className="stat">
                      <span className="num">{tree.nodes.reduce((s, tn) =>
                        s + (nodeMap[tn.id] ? (nodeMap[tn.id].pts || 1) : 0), 0
                      )}</span> pts
                    </div>
                  </div>
                  <TalentTree
                    tree={tree}
                    cluster={clusterForRenderer}
                    flexStyle={tweaks.flexStyle}
                    heatmap={tweaks.heatmap}
                    showSignature={tweaks.showSignature}
                    onHover={setTip}
                    onLeave={() => setTip(null)}
                  />
                </div>
              ))}
            </div>

            <GlobalPvpPanel data={data} onHover={setTip} onLeave={() => setTip(null)} />
            <GearPanel group={data} />
          </div>
        </section>

        <Sidebar
          cluster={cluster}
          group={data}
          onCopy={onCopy}
          heatmap={tweaks.heatmap}
        />
      </main>

      {tip && <Tooltip {...tip} />}
      {toast && <div className="copy-toast">✓ {toast}</div>}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Flex highlight">
          <TweakSelect label="Style" value={tweaks.flexStyle}
            onChange={(v) => setTweak('flexStyle', v)} options={FLEX_STYLES} />
        </TweakSection>
        <TweakSection label="Pick-rate heatmap">
          <TweakToggle label="Color by pick rate" value={tweaks.heatmap}
            onChange={(v) => setTweak('heatmap', v)} />
        </TweakSection>
        <TweakSection label="Cluster signature">
          <TweakToggle label="Mark contested takes" value={tweaks.showSignature}
            onChange={(v) => setTweak('showSignature', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

function GlobalPvpPanel({ data, onHover, onLeave }) {
  const all = data.pvp_talents || [];
  if (all.length === 0) return null;
  const modal = all.slice(0, 3);
  const alts = all.slice(3);

  const onHoverPvp = (e, p) => {
    onHover({

  return (
    <div className="pvp-panel" data-screen-label="PvP talents (global)">
      <div className="pvp-head">

        <div className="stat">
          <span style={{color:'var(--flex)',marginRight:8,fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'0.12em'}}>GLOBAL</span>
          <span>same across all clusters · n={data.sample_size.toLocaleString()}</span>
        </div>
      </div>
      <div className="pvp-grid">
        {modal.map((p, i) => (
          <div className="pvp-slot" key={p.id}

               onMouseLeave={onLeave}>
            <span className="pvp-slot-tag">SLOT {i + 1}</span>

            <div className="pvp-slot-pct">{p.pct}<span className="unit">%</span></div>
          </div>
        ))}
        <div className="pvp-alts">
          <div className="pvp-alts-head">Alternatives · {alts.length}</div>
          <div className="pvp-alts-list">
            {alts.map(p => (
              <div className="pvp-alt-row" key={p.id}
                   onMouseEnter={(e) => onHoverPvp(e, p)}
                   onMouseMove={(e) => onHoverPvp(e, p)}
                   onMouseLeave={onLeave}>
                <span className="pvp-alt-name">{p.name}</span>
                <span className="pvp-alt-bar">
                  <span className="pvp-alt-bar-fill" style={{width: `${p.pct}%`}}></span>
                </span>
                <span className="pvp-alt-pct">{p.pct}%</span>

          </div>
        </div>
      </div>
    </div>
  );
}

function Tooltip({ node, state, x, y }) {
  const role = state ? state.role : 'skip';
  const isContested = state && state.contested;
  const tooltipStyle = {
    left: Math.min(x, window.innerWidth - 300),
    top: Math.min(y, window.innerHeight - 240),
  };
  const isMulti = node.maxPoints && node.maxPoints > 1;
  const rankDist = state && state.rankDist;
  const displayRank = state ? (rankDist ? window.modalRank(state) : state.pts) : 0;
  const rankFlex = state && window.isRankFlex(node, state);

  let tag = 'SKIP';
  if (role === 'core') tag = rankFlex ? 'CORE · RANK-FLEX' : (isContested ? 'CLUSTER TAKE' : 'CORE');
  else if (role === 'flex') tag = 'FLEX';

  return (
    <div className="tooltip" style={tooltipStyle}>
      <div className="tooltip-head">
        <span className="tooltip-name">{node.name}</span>
        <span className={`tooltip-tag ${role} ${isContested ? 'contested' : ''}`}>{tag}</span>
      </div>
      <div className="tooltip-desc">{node.desc}</div>
      {state ? (
        <>
          <div className="tooltip-stat">
            <span>Pick rate {isContested ? '(overall)' : ''}</span>
            <span className="v">{state.pickRate}%</span>
          </div>
          <div className="tooltip-bar">
            <div className="tooltip-bar-fill" style={{width: `${state.pickRate}%`}}></div>
          </div>
          {isMulti && rankDist ? (
            <>
              <div className="tooltip-rank-title">Rank distribution</div>
              {rankDist.map((pct, i) => {
                const modalI = displayRank - 1;
                return (
                  <div className="tooltip-rank-row" key={i}>
                    <span className="lbl">R {i + 1}</span>
                    <span className="bar">
                      <span className={`fill ${i === modalI ? 'modal' : ''}`} style={{width: `${pct}%`}}></span>
                    </span>
                    <span className="pct">{pct}%</span>
                  </div>
                );
              })}
              {(() => {
                const skipPct = Math.max(0, 100 - rankDist.reduce((s,v) => s+v, 0));
                if (skipPct < 0.5) return null;
                return (
                  <div className="tooltip-rank-row">
                    <span className="lbl">skip</span>
                    <span className="bar">
                      <span className="fill" style={{width: `${skipPct}%`, background:'var(--text-3)'}}></span>
                    </span>
                    <span className="pct skip">{Math.round(skipPct)}%</span>
                  </div>
                );
              })()}
            </>
          ) : null}
        </>
      ) : (
        <div className="tooltip-stat">
          <span>Not taken in this cluster</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
